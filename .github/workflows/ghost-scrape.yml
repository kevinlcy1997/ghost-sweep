name: Ghost Sweep Data Collection

on:
  schedule:
    - cron: '0 * * * *'    # Every hour on the hour
  workflow_dispatch:        # Manual trigger

concurrency:
  group: ghost-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cryptography requests

      - name: Run one poll cycle
        run: python ghost_listener.py --once -o ghost_alerts.json --request-timeout 8

      - name: Generate dashboard
        run: python generate_dashboard.py ghost_alerts.json docs

      - name: Commit data
        run: |
          git config user.name "ghost-bot"
          git config user.email "ghost-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add ghost_alerts.json docs/index.html
            git diff --staged --quiet || git commit -m "data: poll $(date -u +%Y-%m-%dT%H:%M:%SZ) — $(python -c "import json; d=json.load(open('ghost_alerts.json')); print(d['meta']['total_alerts'])" 2>/dev/null || echo '?') alerts"
            git push && exit 0

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish data after ${attempt} attempts."
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main
            python ghost_listener.py --once -o ghost_alerts.json --request-timeout 8
            python generate_dashboard.py ghost_alerts.json docs
          done
